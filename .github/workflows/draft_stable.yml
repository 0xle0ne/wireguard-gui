name: Draft stable

on:
  push:
    branches:
      - 'release/stable/**'
  pull_request:
    branches:
      - 'release/stable/**'

permissions:
  contents: read

concurrency:
  group: draft-stable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev libudev-dev patchelf libwebkit2gtk-4.1-dev
      - name: Install node dependencies
        run: npm ci --legacy-peer-deps
      - name: Validate release version
        if: github.event_name == 'push'
        run: |
          branch_version="${GITHUB_REF_NAME#release/stable/}"
          app_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          test "$branch_version" = "$app_version"
      - name: Build application
        run: npm run tauri build -- --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.runner }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  draft:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          path: bundles
          merge-multiple: true
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag="$version-stable"
          if gh release view "$tag" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true
          else
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "$tag" --notes-file CHANGELOG.md
          fi
          gh release edit "$tag" --target "$GITHUB_SHA" --notes-file CHANGELOG.md
          mapfile -t assets < <(find bundles -type f \( -name '*.deb' -o -name '*.AppImage' \))
          test "${#assets[@]}" -eq 4
          gh release upload "$tag" "${assets[@]}" --clobber
